# Real Phase 8 HPC run: multi-year advective (3D) simulation at production
# scale (10,000 super-individuals) against real Barents Sea CMEMS forcing.
# See usermanual.md's "Running the model in parallel using the container"
# section for the full download-then-submit workflow this config plugs into.
#
# Any field can be overridden per-submission without editing this file:
#   python run.py --config config/runs/advection_hpc_barents.yaml \
#       --override population.n_super_individuals=20 --override time.duration_years=0.02

run:
  name: advection_10000si_2y
  scenario: advection_cmems_file
  mode: sequential  # see BENCHMARKING.md Phase 2 before switching to parallel
  seed: 0

population:
  n_super_individuals: 10000
  n_virtual_per_super: 10000
  seeding_rate: 10

time:
  start_date: "2022-01-01"
  duration_years: 2
  timestep_seconds: 21600

location:
  start_lon: 14.25
  start_lat: 69.8

reader:
  # Produced by hpc/download_cmems_data.py on the login node - see
  # usermanual.md. Path is relative to wherever run.py is invoked from
  # (normally the repo root, bind-mounted to /pascal in the container).
  cmems_file: inputdata/cmems/barents_2022_2024.nc
